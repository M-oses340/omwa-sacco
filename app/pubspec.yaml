name: omwa_sacco
description: Omwa Sacco Mobile Banking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.4
  bloc: ^8.1.4
  supabase_flutter: ^2.3.4
  connectivity_plus: ^6.0.3
  webview_flutter: ^4.4.2
  http: ^1.2.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_secure_storage: ^9.0.0
  device_info_plus: ^10.1.0
  local_auth: ^2.1.8
  pinput: ^3.0.1
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  go_router: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
